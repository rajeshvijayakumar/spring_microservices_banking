spring:
  application:
    name: message
  cloud:
    function:
      definition: email|sms # REST API path for combined call will be -> http://localhost:9010/emailsms
server:
  port: 9010

logging:
  pattern:
    console: ${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}