spring:
  application:
    name: gatewayserver

  config:
    import: "optional:configserver:http://localhost:8071/"
    label: main
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false # default routes(ex: http://locahost:8072/account/create)) will be disabled and our custom routing will be only accessible (ex: http://locahost:8072/eaxybank/account/create)
              lowerCaseServiceId: true # accepting lowercase path names in the URI..

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      access: unrestricted
  info:
    env:
      enabled: true

info:
  app:
    name: "gatewayserver"
    description: "Eazy Bank Gateway Server Application"
    version: "1.0"

logging:
  pattern:
    console: ${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}
  level:
    com:
      eazybytes:
        gatewayserver: DEBUG
