# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

deploymentName: accounts-deployment
serviceName: accounts
appLabel: accounts
appName: accounts

replicaCount: 1

image:
  repository: rajeshvjlearn/accounts
  tag: v5

containerPort: 8080

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

appname_enabled: true
profile_enabled: true
config_enabled: true
discovery_enabled: true  # instead of eurekaEnabled, we need to use discoveryEnabled for kubernetes service discovery service
resouceserver_enabled: false
otel_enabled: true
kafka_enabled: true

startupProbe:
  failureThreshold: 30
  periodSeconds: 5