# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

deploymentName: loans-deployment
serviceName: loans
appLabel: loans
appName: loans

replicaCount: 1

image:
  repository: rajeshvjlearn/loans
  tag: v5

containerPort: 8090

service:
  type: ClusterIP
  port: 8090
  targetPort: 8090

appname_enabled: true
profile_enabled: true
config_enabled: true
discovery_enabled: true  # instead of eurekaEnabled, we need to use discoveryEnabled for kubernetes service discovery service
resouceserver_enabled: false
otel_enabled: true
kafka_enabled: false

startupProbe:
  failureThreshold: 30
  periodSeconds: 5